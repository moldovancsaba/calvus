name: IDBC — sync from IDBCSYNC

# The IDBC Salary Guide is built from one place: the IDBCSYNC tab of the client's IDBC_bertabla
# Google Sheet (idbc-salary-guide/docs/11-architecture.md ADR-2, decision D37). This pulls the
# sheet through its public export URL (no credentials — the sheet is shared "anyone with the
# link"), rebuilds the data files and every page text with idbc-salary-guide/data/idbcsync.py,
# runs the repo gate, and pushes to main only when something actually changed. A sheet error
# (a date where text belongs, a word in a salary, an unknown {placeholder}) stops the run before
# anything is written — the live site keeps its last good version and the log names the row.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; GitHub may start a scheduled run a few minutes late
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: idbc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converter dependencies
        run: pip install openpyxl

      - name: Download the live sheet
        run: |
          curl -sL -o /tmp/IDBC_bertabla.xlsx \
            "https://docs.google.com/spreadsheets/d/1aQA6Kw5k1U9LQMiWYgcn__m2YCuGmEhx79QFSzE0hJg/export?format=xlsx"
          file /tmp/IDBC_bertabla.xlsx | grep -q "Excel" || {
            echo "::error::download did not return a real .xlsx — the sheet's sharing may have changed (needs \"Anyone with the link\" view access)"
            exit 1
          }

      - name: Rebuild the guide from IDBCSYNC
        run: python3 idbc-salary-guide/data/idbcsync.py /tmp/IDBC_bertabla.xlsx

      - name: Run the repo gate
        run: python3 check.py

      - name: Commit and push if anything changed
        run: |
          cd idbc-salary-guide
          FILES="data/guide-data.json data/areas.json assets/top3-chart.js index.html berezes/index.html sap/index.html expert-pool/index.html esettanulmanyok/index.html regisztracio/index.html kapcsolat/index.html terulet/index.html"
          if git diff --quiet -- $FILES; then
            echo "No change in IDBCSYNC — nothing to sync."
            exit 0
          fi
          git config user.name "idbc-data-sync"
          git config user.email "idbc-data-sync@users.noreply.github.com"
          git add -- $FILES
          git commit -m "IDBC Salary Guide: sync from IDBCSYNC" -m "$(git diff --cached --stat | tail -1)"
          git pull --rebase origin main
          git push
